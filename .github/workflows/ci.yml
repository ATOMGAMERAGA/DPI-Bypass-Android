name: CI

# Her commit / push ve pull request'te çalışır. Sadece test + derleme, RELEASE YOK.

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]      # sürüm etiketleri release.yml tarafından ele alınır
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Derle & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (submodüllerle)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: NDK & CMake kur
        run: yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Gradle kurulum + cache
        uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Debug APK derle (derleme kontrolü)
        run: ./gradlew assembleDebug --stacktrace

      - name: Debug APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
