name: Release

# MANUEL çalışır (Actions sekmesi > Release > Run workflow).
# Girilen sürümü tek kaynaktan (gradle.properties) HER YERE yansıtır,
# testleri çalıştırır, imzalı APK üretir ve GitHub Release olarak yayınlar.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (SemVer, ör. 1.2.0)"
        required: true
        type: string
      prerelease:
        description: "Ön sürüm (prerelease) olarak işaretle"
        required: false
        default: false
        type: boolean
      notes:
        description: "Sürüm notları (opsiyonel)"
        required: false
        type: string
      debug_signing:
        description: "SADECE TEST: debug anahtarıyla imzala (tag/release oluşturmaz, APK yalnızca artifact olur — dağıtmayın)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write        # commit push + tag + release için gerekli

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test & Yayınla
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (submodüllerle)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sürümü doğrula (SemVer X.Y.Z)
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Geçersiz sürüm. Beklenen biçim: X.Y.Z"; exit 1; }

      - name: versionCode hesapla
        id: ver
        run: |
          IFS='.' read -r MA MI PA <<< "${{ inputs.version }}"
          # minor ve patch < 100 varsayımı; ör. 1.2.0 -> 10200
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: NDK & CMake kur
        run: yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Gradle kurulum + cache
        uses: gradle/actions/setup-gradle@v4

      # ---- Sürümü tek kaynaktan her yere yansıt ----
      - name: gradle.properties içinde sürümü güncelle
        run: |
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${{ inputs.version }}/" gradle.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${{ steps.ver.outputs.code }}/" gradle.properties
          echo "----- gradle.properties -----"
          grep -E '^VERSION_(NAME|CODE)=' gradle.properties

      - name: Testler (release öncesi kapı)
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Keystore'u hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_SIGNING: ${{ inputs.debug_signing }}
        run: |
          if [ "$DEBUG_SIGNING" = "true" ]; then
            echo "::warning::'DEBUG anahtarıyla imzala' seçili — üretilecek APK SADECE test içindir. \
          Debug anahtarı her CI çalıştırmasında yeniden üretilir: imzası her sürümde farklı olur, \
          kullanıcı üzerine güncelleme kuramaz ve Play Protect 'bilinmeyen geliştirici' uyarısı verir. Dağıtmayın."
            echo "ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=debug" >> "$GITHUB_ENV"
            exit 0
          fi

          MISSING=""
          [ -n "$KEYSTORE_BASE64"  ] || MISSING="$MISSING KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || MISSING="$MISSING KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS"        ] || MISSING="$MISSING KEY_ALIAS"
          [ -n "$KEY_PASSWORD"     ] || MISSING="$MISSING KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Eksik imzalama secret'ı:$MISSING — Settings > Secrets and variables > Actions altında tanımlayın. Kurulum: docs/Imzalama-Rehberi.md. Sadece test APK'sı istiyorsanız 'DEBUG anahtarıyla imzala' kutusunu işaretleyin."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Keystore gerçekten açılabiliyor mu? (yanlış parola/bozuk base64 erken yakalanır)
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                  -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore açılamadı — KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS değerlerini kontrol edin."; exit 1; }

          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_KIND=release" >> "$GITHUB_ENV"
          echo "Keystore doğrulandı — RESMİ imza ile derlenecek."

      - name: Release APK derle
        env:
          # RELEASE_STORE_FILE ve ALLOW_DEBUG_SIGNING önceki adımda GITHUB_ENV'e yazılır.
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: İmzayı doğrula ve APK'yı adlandır
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          if [ "$SIGNING_KIND" = "debug" ]; then
            OUT="dist/DPIBypass-${{ inputs.version }}-TEST-debugsigned.apk"
          else
            OUT="dist/DPIBypass-${{ inputs.version }}.apk"
          fi
          cp "$APK" "$OUT"
          # İmza sahibini logla — hangi anahtarla çıktığı sürüm kaydında görünsün.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$OUT" | grep -E 'Signer #1 (certificate DN|certificate SHA-256 digest)' || true

      # --- Debug imzalı test çalıştırması: sürüm bump / tag / release YOK. ---
      - name: Test APK'sını artifact olarak yükle (yalnızca debug imza)
        if: ${{ inputs.debug_signing }}
        uses: actions/upload-artifact@v4
        with:
          name: DPIBypass-${{ inputs.version }}-TEST-debugsigned
          path: dist/*.apk

      - name: Sürüm bump commit'i
        if: ${{ !inputs.debug_signing }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: release v${{ inputs.version }}" || echo "commit'lenecek değişiklik yok"
          git push origin HEAD:${{ github.ref_name }}

      - name: Etiket oluştur
        if: ${{ !inputs.debug_signing }}
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: GitHub Release yayınla
        if: ${{ !inputs.debug_signing }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "DPI Bypass v${{ inputs.version }}"
          body: ${{ inputs.notes }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/DPIBypass-${{ inputs.version }}.apk
